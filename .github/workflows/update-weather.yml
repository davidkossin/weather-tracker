name: Update weather data

on:
  schedule:
    # Daily ~7:00 AM PT (America/Los_Angeles; UTC-7 in PDT)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather
        run: python3 scripts/fetch_weather.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No weather data changes"
            exit 0
          fi
          END=$(python3 -c 'import json; print(json.load(open("data.json"))["endDate"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update weather data through ${END}"
          git push
